        - generic [ref=f77e49]:
          - generic [ref=f77e50]:
            - text: "01"
            - heading "Istanbul is not one urban environment" [level=3] [ref=f77e51]
            - generic [ref=f77e52]:
              - paragraph [ref=f77e53]: A frozen five-cluster typology built from ~94 spatial indicators shows Istanbul is made of recurring, structurally different urban regimes -- not a single uniform city.
              - link "Explore urban typology →" [ref=f77e54] [cursor=pointer]:
                - /url: /typology
          - generic [ref=f77e55]:
            - text: "02"
            - heading "Everyday access is highly concentrated" [level=3] [ref=f77e56]
            - generic [ref=f77e57]:
              - paragraph [ref=f77e58]: Complete 15-minute walking access to Food, Healthcare and Education is concentrated in a small share of grid cells that hold a large share of the population -- a real property of Istanbul's population distribution, not a modeling artifact.
              - link "See 15-Minute Istanbul →" [ref=f77e59] [cursor=pointer]:
                - /url: /fifteen-minute
          - generic [ref=f77e60]:
            - text: "03"
            - heading "Cycling changes the map" [level=3] [ref=f77e61]
            - generic [ref=f77e62]:
              - paragraph [ref=f77e63]: Modeled cycling accessibility reaches a much larger share of the population than walking alone, and materially expands where residents could potentially reach everyday needs.
              - link "See the Cycling Gain →" [ref=f77e64] [cursor=pointer]:
                - /url: /cycling-gain
          - generic [ref=f77e65]:
            - text: "04"
            - heading "Cycling can also extend transit catchments" [level=3] [ref=f77e66]
            - generic [ref=f77e67]:
              - paragraph [ref=f77e68]: Beyond everyday needs, cycling potentially expands how many residents can reach general transit and, especially, fixed-guideway/high-capacity transit stops within a modeled time budget.
              - link "See Transit Connection →" [ref=f77e69] [cursor=pointer]:
                - /url: /transit
          - generic [ref=f77e70]:
            - text: "05"
            - heading "Some gaps remain" [level=3] [ref=f77e71]
            - generic [ref=f77e72]:
              - paragraph [ref=f77e73]: Not every accessibility gap is closed by cycling. Where destinations themselves are sparse, no mode-shift can create access that does not exist.
              - link "See Accessibility Gaps →" [ref=f77e74] [cursor=pointer]:
                - /url: /gaps
          - generic [ref=f77e75]:
            - text: "06"
            - heading "Data quality matters" [level=3] [ref=f77e76]
            - generic [ref=f77e77]:
              - paragraph [ref=f77e78]: Network and transit-feed quality vary across the city. This product treats uncertainty as a first-class signal, not something to hide inside an average.
              - link "See Data & Methods →" [ref=f77e79] [cursor=pointer]:
                - /url: /methods
