        - generic [ref=f16e49]:
          - generic [ref=f16e50]:
            - text: "01"
            - heading "Istanbul is not one urban environment" [level=3] [ref=f16e51]
            - generic [ref=f16e52]:
              - paragraph [ref=f16e53]: A frozen five-cluster typology built from ~94 spatial indicators shows Istanbul is made of recurring, structurally different urban regimes -- not a single uniform city.
              - link "Explore urban typology →" [ref=f16e54] [cursor=pointer]:
                - /url: /typology
          - generic [ref=f16e55]:
            - text: "02"
            - heading "Everyday access is highly concentrated" [level=3] [ref=f16e56]
            - generic [ref=f16e57]:
              - paragraph [ref=f16e58]: Complete 15-minute walking access to Food, Healthcare and Education is concentrated in a small share of grid cells that hold a large share of the population -- a real property of Istanbul's population distribution, not a modeling artifact.
              - link "See 15-Minute Istanbul →" [ref=f16e59] [cursor=pointer]:
                - /url: /fifteen-minute
          - generic [ref=f16e60]:
            - text: "03"
            - heading "Cycling changes the map" [level=3] [ref=f16e61]
            - generic [ref=f16e62]:
              - paragraph [ref=f16e63]: Modeled cycling accessibility reaches a much larger share of the population than walking alone, and materially expands where residents could potentially reach everyday needs.
              - link "See the Cycling Gain →" [ref=f16e64] [cursor=pointer]:
                - /url: /cycling-gain
          - generic [ref=f16e65]:
            - text: "04"
            - heading "Cycling can also extend transit catchments" [level=3] [ref=f16e66]
            - generic [ref=f16e67]:
              - paragraph [ref=f16e68]: Beyond everyday needs, cycling potentially expands how many residents can reach general transit and, especially, fixed-guideway/high-capacity transit stops within a modeled time budget.
              - link "See Transit Connection →" [ref=f16e69] [cursor=pointer]:
                - /url: /transit
          - generic [ref=f16e70]:
            - text: "05"
            - heading "Some gaps remain" [level=3] [ref=f16e71]
            - generic [ref=f16e72]:
              - paragraph [ref=f16e73]: Not every accessibility gap is closed by cycling. Where destinations themselves are sparse, no mode-shift can create access that does not exist.
              - link "See Accessibility Gaps →" [ref=f16e74] [cursor=pointer]:
                - /url: /gaps
          - generic [ref=f16e75]:
            - text: "06"
            - heading "Data quality matters" [level=3] [ref=f16e76]
            - generic [ref=f16e77]:
              - paragraph [ref=f16e78]: Network and transit-feed quality vary across the city. This product treats uncertainty as a first-class signal, not something to hide inside an average.
              - link "See Data & Methods →" [ref=f16e79] [cursor=pointer]:
                - /url: /methods
