        - generic [ref=f58e49]:
          - generic [ref=f58e50]:
            - text: "01"
            - heading "Istanbul is not one urban environment" [level=3] [ref=f58e51]
            - generic [ref=f58e52]:
              - paragraph [ref=f58e53]: A frozen five-cluster typology built from ~94 spatial indicators shows Istanbul is made of recurring, structurally different urban regimes -- not a single uniform city.
              - link "Explore urban typology →" [ref=f58e54] [cursor=pointer]:
                - /url: /typology
          - generic [ref=f58e55]:
            - text: "02"
            - heading "Everyday access is highly concentrated" [level=3] [ref=f58e56]
            - generic [ref=f58e57]:
              - paragraph [ref=f58e58]: Complete 15-minute walking access to Food, Healthcare and Education is concentrated in a small share of grid cells that hold a large share of the population -- a real property of Istanbul's population distribution, not a modeling artifact.
              - link "See 15-Minute Istanbul →" [ref=f58e59] [cursor=pointer]:
                - /url: /fifteen-minute
          - generic [ref=f58e60]:
            - text: "03"
            - heading "Cycling changes the map" [level=3] [ref=f58e61]
            - generic [ref=f58e62]:
              - paragraph [ref=f58e63]: Modeled cycling accessibility reaches a much larger share of the population than walking alone, and materially expands where residents could potentially reach everyday needs.
              - link "See the Cycling Gain →" [ref=f58e64] [cursor=pointer]:
                - /url: /cycling-gain
          - generic [ref=f58e65]:
            - text: "04"
            - heading "Cycling can also extend transit catchments" [level=3] [ref=f58e66]
            - generic [ref=f58e67]:
              - paragraph [ref=f58e68]: Beyond everyday needs, cycling potentially expands how many residents can reach general transit and, especially, fixed-guideway/high-capacity transit stops within a modeled time budget.
              - link "See Transit Connection →" [ref=f58e69] [cursor=pointer]:
                - /url: /transit
          - generic [ref=f58e70]:
            - text: "05"
            - heading "Some gaps remain" [level=3] [ref=f58e71]
            - generic [ref=f58e72]:
              - paragraph [ref=f58e73]: Not every accessibility gap is closed by cycling. Where destinations themselves are sparse, no mode-shift can create access that does not exist.
              - link "See Accessibility Gaps →" [ref=f58e74] [cursor=pointer]:
                - /url: /gaps
          - generic [ref=f58e75]:
            - text: "06"
            - heading "Data quality matters" [level=3] [ref=f58e76]
            - generic [ref=f58e77]:
              - paragraph [ref=f58e78]: Network and transit-feed quality vary across the city. This product treats uncertainty as a first-class signal, not something to hide inside an average.
              - link "See Data & Methods →" [ref=f58e79] [cursor=pointer]:
                - /url: /methods
